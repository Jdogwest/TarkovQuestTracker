<div class="shell">
  <header class="header">
    <h1 class="title">{{ title() }}</h1>
    <nav class="tabs">
      <button
        type="button"
        class="tab"
        [class.tab-active]="activeTab() === 'quests'"
        (click)="setTab('quests')"
      >
        Квесты
      </button>
      <button
        type="button"
        class="tab"
        [class.tab-active]="activeTab() === 'keys'"
        (click)="setTab('keys')"
      >
        Ключи
      </button>
    </nav>
  </header>
  <main class="main">
    @switch (activeTab()) {
      @case ('quests') {
        <app-quests />
      }
      @case ('keys') {
        <app-keys />
      }
    }
  </main>
</div>
