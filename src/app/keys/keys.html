<div class="page">
  <label class="field search-field">
    <span class="label">Поиск</span>
    <input
      type="search"
      class="input"
      placeholder="Фильтр по названию"
      [value]="searchQuery()"
      (input)="updateSearch($any($event.target).value)"
    />
  </label>

  <div class="add-row">
    <input type="text" class="input" placeholder="Название ключа" [(ngModel)]="newName" />
    <input
      type="number"
      class="input input-price"
      placeholder="Цена"
      [(ngModel)]="newPrice"
      min="0"
      step="1"
    />
    <button type="button" class="btn btn-icon" title="Добавить ключ" (click)="addKey()">+</button>
  </div>

  <ul class="list">
    @for (key of filteredKeys(); track $index) {
      <li class="list-item">
        <span class="list-text">{{ key.name }} ({{ key.price }})</span>
        <button type="button" class="btn btn-danger" (click)="removeKey(key)">Удалить</button>
      </li>
    } @empty {
      <li class="list-empty">Нет ключей</li>
    }
  </ul>
</div>
